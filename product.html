<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — Regent Stores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/"><img data-logo src="/assets/logo.jpg" alt="Regent Stores"><span data-business-name>Regent Stores</span></a>
    <nav class="main-nav">
      <span class="nav-links">
        <a href="/">Home</a>
        <a href="/products.html">Products</a>
        <a href="/#contact">Contact</a>
      </span>
      <button class="cart-toggle" data-open-cart>Cart <span class="cart-count" id="cart-count">0</span></button>
    </nav>
  </div>
</header>

<div id="product-root">
  <section class="product-detail">
    <div class="wrap">
      <div class="gallery">
        <img id="p-image" src="" alt="">
      </div>
      <div class="info">
        <div class="eyebrow">REGENT STORES</div>
        <h1 id="p-name" class="display" style="font-size:2rem; margin-top:8px;">Loading…</h1>
        <span class="promo-badge" id="p-promo" style="display:none;"></span>
        <div class="price" id="p-price" style="font-size:1.8rem;"></div>
        <p id="p-description"></p>

        <div class="qty-stepper">
          <button id="qty-minus" aria-label="Decrease quantity">−</button>
          <span id="p-qty">1</span>
          <button id="qty-plus" aria-label="Increase quantity">+</button>
        </div>
        <div>
          <button class="btn btn-primary" id="add-to-cart-btn">Add to cart</button>
        </div>

        <ul class="detail-list" id="p-details"></ul>
      </div>
    </div>

    <div class="wrap">
      <div class="reviews-block">
        <h2>What customers say</h2>
        <div id="reviews-list"></div>
      </div>
    </div>
  </section>
</div>

<footer class="site-footer">
  <div class="wrap">
    <span>© <span id="year"></span> <span data-business-name>Regent Stores</span>. All rights reserved.</span>
    <a href="/admin.html" style="color:inherit; text-decoration:none;">Admin</a>
  </div>
</footer>

<a class="wa-float" data-wa-link href="https://wa.me/2348072335354" target="_blank" rel="noopener" aria-label="Order on WhatsApp">
  <svg viewBox="0 0 32 32" fill="white"><path d="M16 2C8.3 2 2 8.3 2 16c0 2.6.7 5.1 2 7.3L2 30l6.9-1.8c2.1 1.2 4.5 1.8 7.1 1.8 7.7 0 14-6.3 14-14S23.7 2 16 2zm0 25.5c-2.3 0-4.5-.6-6.4-1.8l-.5-.3-4.1 1.1 1.1-4-.3-.5C4.6 20.1 4 18.1 4 16 4 9.4 9.4 4 16 4s12 5.4 12 12-5.4 11.5-12 11.5zm6.6-8.7c-.4-.2-2.1-1-2.4-1.2-.3-.1-.6-.2-.8.2-.2.4-.9 1.2-1.1 1.4-.2.2-.4.3-.8.1-.4-.2-1.6-.6-3-1.9-1.1-1-1.9-2.2-2.1-2.6-.2-.4 0-.6.2-.8.2-.2.4-.4.6-.7.2-.2.3-.4.4-.7.1-.3.1-.5 0-.7-.1-.2-.8-2-1.1-2.7-.3-.7-.6-.6-.8-.6h-.7c-.2 0-.6.1-.9.5-.3.4-1.2 1.1-1.2 2.8s1.2 3.3 1.4 3.5c.2.2 2.4 3.7 5.9 5.1.8.3 1.4.5 1.9.7.8.2 1.5.2 2.1.1.6-.1 2.1-.9 2.4-1.7.3-.8.3-1.5.2-1.7-.1-.1-.3-.2-.7-.4z"/></svg>
</a>
<button class="btn btn-gold order-float" data-open-cart>Order Now</button>

<div class="cart-overlay" id="cart-overlay"></div>
<aside class="cart-drawer" id="cart-drawer" aria-label="Shopping cart">
  <div class="cart-head">
    <h3 style="margin:0;">Your cart</h3>
    <button data-close-cart aria-label="Close cart">×</button>
  </div>
  <div class="cart-items" id="cart-items"></div>
  <div class="cart-footer">
    <div class="cart-total"><span>Total</span><span id="cart-total-amount">₦0</span></div>
    <button class="btn btn-primary btn-block" id="checkout-whatsapp">Checkout via WhatsApp</button>
  </div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/main.js"></script>
<script src="/js/product-detail.js"></script>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
